services:
  - type: web
    name: ghostlight
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /studio
        destination: /index.html
      - type: rewrite
        source: /studio/*
        destination: /index.html
      - type: rewrite
        source: /ofrenda/*
        destination: /index.html
      - type: rewrite
        source: /archive
        destination: /index.html
      - type: rewrite
        source: /about
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
